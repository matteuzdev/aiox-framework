<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f8f3ea"/>
  <rect x="70" y="70" width="940" height="1210" rx="42" fill="#fffdfa" stroke="rgba(21,32,37,0.12)"/>
  <text x="120" y="170" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">02</text>
  <text x="120" y="365" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="600">Muita empresa</text>
  <text x="120" y="470" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="600">não precisa de</text>
  <text x="120" y="575" fill="#0a4b41" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="600">“mais IA”.</text>
  <text x="120" y="740" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="42">Precisa parar de perder tempo, dinheiro</text>
  <text x="120" y="800" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="42">e previsibilidade na operação.</text>
  <line x1="120" y1="890" x2="960" y2="890" stroke="#d7cdc0"/>
  <text x="120" y="1010" fill="#0f6b5d" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">IA é mecanismo.</text>
  <text x="120" y="1060" fill="#0f6b5d" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">O problema do cliente vem antes.</text>
</svg>
