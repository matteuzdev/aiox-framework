<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f8f3ea"/>
  <rect x="70" y="70" width="940" height="1210" rx="42" fill="#fffdfa" stroke="rgba(21,32,37,0.12)"/>
  <text x="120" y="170" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">06</text>
  <text x="120" y="330" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="84" font-weight="600">É por isso que eu</text>
  <text x="120" y="420" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="84" font-weight="600">prefiro falar de:</text>
  <text x="150" y="620" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">agenda vazando receita</text>
  <text x="150" y="735" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">processo travado</text>
  <text x="150" y="850" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">atendimento lento</text>
  <text x="150" y="965" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">operação sem sistema</text>
  <text x="120" y="1145" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="36">O comprador quer ver domínio de problema, não só entusiasmo com ferramenta.</text>
</svg>
