<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f8f3ea"/>
  <circle cx="160" cy="170" r="150" fill="#dfe9e4"/>
  <rect x="70" y="70" width="940" height="1210" rx="42" fill="#fffdfa" stroke="rgba(21,32,37,0.12)"/>
  <text x="120" y="170" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">04</text>
  <text x="120" y="375" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="84" font-weight="600">Comprador de</text>
  <text x="120" y="468" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="84" font-weight="600">verdade reage a:</text>
  <text x="160" y="650" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">dor clara</text>
  <text x="160" y="770" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">problema caro</text>
  <text x="160" y="890" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">resultado mensurável</text>
  <line x1="120" y1="980" x2="960" y2="980" stroke="#d7cdc0"/>
  <text x="120" y="1100" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="38">Se não houver isso, o conteúdo chama atenção,</text>
  <text x="120" y="1150" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="38">mas não puxa contrato.</text>
