<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f8f3ea"/>
  <rect x="70" y="70" width="940" height="1210" rx="42" fill="#fffdfa" stroke="rgba(21,32,37,0.12)"/>
  <text x="120" y="170" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4">03</text>
  <rect x="120" y="280" width="820" height="160" rx="22" fill="#f1eadf"/>
  <text x="160" y="360" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Consulta desmarcada</text>
  <text x="160" y="410" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">sem reposição.</text>
  <rect x="120" y="500" width="820" height="160" rx="22" fill="#f1eadf"/>
  <text x="160" y="580" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Paciente que para no meio</text>
  <text x="160" y="630" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">do atendimento.</text>
  <rect x="120" y="720" width="820" height="190" rx="22" fill="#f1eadf"/>
  <text x="160" y="800" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Agenda com buracos</text>
  <text x="160" y="850" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">que ninguém corrige</text>
  <text x="160" y="900" fill="#152025" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">a tempo.</text>
</svg>
