  <text x="120" y="170" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4">05</text>
  <text x="120" y="360" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="78" font-weight="600">Quando a operação</text>
  <text x="120" y="445" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="78" font-weight="600">depende demais</text>
  <text x="120" y="530" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="78" font-weight="600">de correria,</text>
  <rect x="120" y="670" width="840" height="300" rx="28" fill="#0a4b41"/>
  <text x="170" y="790" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="600">o erro deixa</text>
  <text x="170" y="870" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="600">de ser exceção.</text>
  <text x="170" y="950" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="600">Vira sistema.</text>
