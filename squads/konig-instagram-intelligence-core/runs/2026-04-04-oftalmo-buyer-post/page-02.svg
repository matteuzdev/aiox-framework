<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f8f3ea"/>
  <rect x="70" y="70" width="940" height="1210" rx="42" fill="#fffdfa" stroke="rgba(21,32,37,0.12)"/>
  <text x="120" y="170" fill="#0a4b41" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4">02</text>
  <text x="120" y="340" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">O problema</text>
  <text x="120" y="430" fill="#152025" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">nem sempre é</text>
  <text x="120" y="520" fill="#0a4b41" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">falta de paciente.</text>
  <line x1="120" y1="620" x2="960" y2="620" stroke="#d7cdc0"/>
  <text x="120" y="760" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="42">Muitas vezes, o dinheiro</text>
  <text x="120" y="820" fill="#314047" font-family="Arial, Helvetica, sans-serif" font-size="42">se perde na rotina.</text>
  <text x="120" y="1030" fill="#0f6b5d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">agenda</text>
  <text x="320" y="1030" fill="#0f6b5d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">atendimento</text>
  <text x="610" y="1030" fill="#0f6b5d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">retorno</text>
</svg>
