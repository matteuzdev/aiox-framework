<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0a4b41"/>
  <circle cx="900" cy="1110" r="220" fill="rgba(255,253,250,0.10)"/>
  <text x="120" y="170" fill="#fffdfa" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4">07</text>
  <text x="120" y="350" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">Se a sua operação</text>
  <text x="120" y="440" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">ainda apaga</text>
  <text x="120" y="530" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">incêndio todos</text>
  <text x="120" y="620" fill="#fffdfa" font-family="Georgia, Times New Roman, serif" font-size="82" font-weight="600">os dias,</text>
  <text x="120" y="800" fill="#dfe9e4" font-family="Arial, Helvetica, sans-serif" font-size="42">talvez o problema não esteja na captação.</text>
  <text x="120" y="860" fill="#dfe9e4" font-family="Arial, Helvetica, sans-serif" font-size="42">Esteja na forma como a clínica funciona.</text>
  <line x1="120" y1="970" x2="960" y2="970" stroke="rgba(255,253,250,0.24)"/>
  <text x="120" y="1080" fill="#fffdfa" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Se isso te preocupa, a conversa certa é sobre operação.</text>
  <text x="120" y="1160" fill="#dfe9e4" font-family="Arial, Helvetica, sans-serif" font-size="30">Konig Systems</text>
</svg>
