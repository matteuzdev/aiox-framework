<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konig Systems - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .hero {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 32px;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .arrow {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="badge">🤖 SDR Agent com Groq + Llama 3.3</div>
        <h1>Konig Systems</h1>
        <p>Clique no botao de chat no canto inferior direito para conversar com nosso SDR Agent. Ele qualifica leads e atualiza o CRM automaticamente!</p>
        <div class="arrow">👇</div>
    </div>

    <!-- Widget do SDR - 1 linha de script, igual ao GPT Maker -->
    <script src="http://localhost:8000/api/widget.js"></script>
</body>
</html>
