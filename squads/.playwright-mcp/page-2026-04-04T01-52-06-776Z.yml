                - paragraph [ref=e824]:
                  - strong [ref=e825]: Preciso saber programar?
                - paragraph [ref=e826]: Não. Você escreve o que precisa em português simples e o sistema executa.
                - paragraph [ref=e827]:
                  - strong [ref=e828]: Funciona para qualquer nicho?
                - paragraph [ref=e829]: Sim. Saúde, fitness, finanças, educação, e-commerce, SaaS, consultoria, gastronomia, moda, beleza, tecnologia. O sistema se adapta ao nicho porque começa analisando o mercado específico antes de criar qualquer conteúdo.
                - paragraph [ref=e830]:
                  - strong [ref=e831]: A qualidade é boa de verdade?
                - paragraph [ref=e832]: O Projeto NutroPosts gerou 250 PNGs em resolução retina (2160×2700px) com design system profissional aplicado. Cada post passou por inspeção automatizada de qualidade. O resultado é indistinguível de material produzido por uma agência premium.
                - paragraph [ref=e833]:
                  - strong [ref=e834]: Posso usar minha identidade visual?
                - paragraph [ref=e835]: Sim. Você configura seu design system uma vez (cores, fontes, logo, estilo) e o sistema aplica automaticamente em tudo que produz.
                - paragraph [ref=e836]:
                  - strong [ref=e837]: Quanto tempo leva para produzir conteúdo?
                - paragraph [ref=e838]: Depende do volume. 50 posts completos com imagens IA e legendas otimizadas levaram menos de 2 horas no Projeto NutroPosts. Um lote de 10 posts simples sai em minutos.
                - paragraph [ref=e839]:
                  - strong [ref=e840]: Serve para além do Instagram?
                - paragraph [ref=e841]: Sim. Instagram, TikTok, YouTube, Facebook e Web. O conteúdo é adaptado para as dimensões e boas práticas de cada plataforma.
                - paragraph [ref=e842]:
                  - strong [ref=e843]: Dá para espionar concorrentes?
                - paragraph [ref=e844]: Sim. O sistema analisa perfis, posts, reels, stories, hashtags, comentários e até anúncios pagos via Meta Ads Library. Entrega relatórios com tudo que seus concorrentes estão fazendo e o que está gerando resultado.
                - paragraph [ref=e845]:
                  - strong [ref=e846]: E se eu precisar só de copy, sem design?
                - paragraph [ref=e847]: O sistema é modular. Você pode pedir só headlines, só uma sales letter, só uma sequência de emails, só um funil de vendas. Usa o que precisar.
                - paragraph [ref=e848]:
                  - strong [ref=e849]: Os posts ficam todos iguais?
                - paragraph [ref=e850]: Não. Cada post é criado com base em dados reais do nicho e do público. O sistema varia formatos (carrossel, infográfico, post único), ângulos (educativo, inspiracional, polêmico, prático) e abordagens. A identidade visual é consistente, mas o conteúdo é diverso.
                - paragraph [ref=e851]:
                  - strong [ref=e852]: Preciso de alguma chave de API ou serviço?
                - paragraph [ref=e853]:
                  - text: Sim. O sistema usa a API do Google Gemini para geração de imagens e análise de mídia. Você precisa de uma
                  - code [ref=e854]: GOOGLE_API_KEY
                  - text: . É a única dependência externa obrigatória.
                - paragraph [ref=e855]:
                  - strong [ref=e856]: Quanto conteúdo consigo produzir de uma vez?
                - paragraph [ref=e857]: Não tem limite prático. O Projeto NutroPosts produziu 50 posts com 250 PNGs em uma única execução. Você pode pedir 10, 30, 50 ou 100 posts. O sistema escala com o tamanho do pedido.
                - paragraph [ref=e858]:
                  - strong [ref=e859]: A copy vem em que idioma?
                - paragraph [ref=e860]: Português brasileiro por padrão. Toda a copy é adaptada para o mercado BR, com referências culturais, expressões naturais e tom de voz adequado. Se precisar em outro idioma, é só especificar.
                - paragraph [ref=e861]:
                  - strong [ref=e862]: Posso usar para clientes diferentes com marcas diferentes?
                - paragraph [ref=e863]: Sim. Cada execução pode usar um design system diferente. Você configura as cores, fontes e estilo de cada cliente e o sistema aplica automaticamente. Ideal para agências que gerenciam múltiplas marcas.
