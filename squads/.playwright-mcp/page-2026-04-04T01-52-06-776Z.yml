                - separator [ref=e148]
                - heading "Você reconhece essa situação?Link to section" [level=2] [ref=e149]:
                  - text: Você reconhece essa situação?
                  - link "Link to section" [ref=e150] [cursor=pointer]:
                    - /url: "#voc-reconhece-essa-situao"
                    - img [ref=e151]
                - paragraph [ref=e154]: É segunda-feira de manhã. Você abre o computador e a lista de tarefas já está gritando.
                - paragraph [ref=e155]: Precisa criar posts para 3 clientes. Precisa espionar o que os concorrentes estão fazendo. Precisa escrever legendas que prendam atenção. Precisa gerar imagens que não pareçam banco de fotos genérico. Precisa pensar na estratégia de lançamento. Precisa montar a oferta. Precisa escrever os emails. Precisa criar a landing page.
                - paragraph [ref=e156]: E o dia só tem 24 horas.
                - paragraph [ref=e157]: Você contrata freelancers. Um faz o design, outro escreve os textos, outro cuida da estratégia. O resultado? Três visões diferentes, nenhuma consistência, e uma conta que não para de crescer.
                - paragraph [ref=e158]: Ou então você faz tudo sozinho. Abre o Canva, tenta criar algo bonito, escreve uma legenda às pressas, publica e torce para que alguém se importe. No fundo, você sabe que o conteúdo ficou medíocre.
                - paragraph [ref=e159]: "Enquanto isso, seu concorrente publica todo dia. Posts bonitos. Legendas que geram comentários. Stories que vendem. E você fica se perguntando: \"como essa pessoa tem tempo para tudo isso?\""
                - paragraph [ref=e160]:
                  - strong [ref=e161]: A resposta não é ter mais tempo. É ter o sistema certo.
                - paragraph [ref=e162]: "A verdade é simples: produzir conteúdo profissional para redes sociais exige pelo menos 4 habilidades diferentes. Estratégia, design, copywriting e análise de dados. Nenhuma pessoa sozinha domina as 4. Nenhuma equipe pequena dá conta de 4 ao mesmo tempo."
                - paragraph [ref=e163]: Você tem duas opções. Aceitar que o conteúdo vai sair medíocre. Ou encontrar um jeito de ter as 4 habilidades trabalhando juntas, sem precisar de 4 salários diferentes.
                - separator [ref=e164]
                - heading "O que é isso?Link to section" [level=2] [ref=e165]:
                  - text: O que é isso?
                  - link "Link to section" [ref=e166] [cursor=pointer]:
                    - /url: "#o-que-isso"
                    - img [ref=e167]
                - paragraph [ref=e170]: O Nirvana é o seu departamento completo de marketing digital comprimido em um único sistema.
                - paragraph [ref=e171]: Você descreve o que precisa em português simples. O sistema analisa, cria, escreve, renderiza e entrega tudo pronto para publicar.
                - paragraph [ref=e172]: Não é um template. Não é um gerador de texto genérico. Não é mais um "assistente de IA" que entrega rascunho meia-boca para você ajustar por 3 horas.
                - paragraph [ref=e173]: É um time de 21 especialistas que trabalham juntos, cada um cuidando de uma parte do processo. Um analisa seus concorrentes. Outro define a estratégia. Outro cria o visual. Outro escreve o texto. Outro gera as imagens. Outro verifica a qualidade. Do primeiro insight competitivo até o post finalizado com legenda, imagem e hashtags otimizadas.
                - separator [ref=e174]
                - heading "🎯 O que você consegue fazer com issoLink to section" [level=2] [ref=e175]:
                  - text: 🎯 O que você consegue fazer com isso
                  - link "Link to section" [ref=e176] [cursor=pointer]:
                    - /url: "#-o-que-voc-consegue-fazer-com-isso"
                    - img [ref=e177]
                - heading "Espionar concorrentes em qualquer plataformaLink to section" [level=3] [ref=e180]:
                  - text: Espionar concorrentes em qualquer plataforma
                  - link "Link to section" [ref=e181] [cursor=pointer]:
                    - /url: "#espionar-concorrentes-em-qualquer-plataforma"
                    - img [ref=e182]
                - paragraph [ref=e185]: "Você escolhe os perfis que quer analisar. O sistema vasculha tudo: posts, reels, stories, hashtags, comentários, anúncios pagos. Depois entrega um relatório mostrando o que funciona, o que não funciona, quais posts viralizaram e por quê."
                - paragraph [ref=e186]: Funciona com Instagram, TikTok, YouTube e Facebook. Você vê o que seus concorrentes estão fazendo antes mesmo de eles perceberem que estão sendo observados.
                - list [ref=e187]:
                  - listitem [ref=e188]: "Análise completa de perfis: seguidores, frequência de posts, taxa de engajamento, crescimento"
                  - listitem [ref=e189]: Detecção automática de posts virais e padrões que geram resultado
                  - listitem [ref=e190]: Espionagem de anúncios pagos via Meta Ads Library com histórico de longevidade
                  - listitem [ref=e191]: Transcrição e análise de vídeos e imagens usando visão computacional
                  - listitem [ref=e192]: "Métricas atualizadas para 2026: Sends > Saves > Shares > Comments > Likes"
                - heading "Criar posts prontos para publicarLink to section" [level=3] [ref=e193]:
                  - text: Criar posts prontos para publicar
                  - link "Link to section" [ref=e194] [cursor=pointer]:
                    - /url: "#criar-posts-prontos-para-publicar"
                    - img [ref=e195]
                - paragraph [ref=e198]: Não é rascunho. Não é sugestão. São posts finalizados com design profissional, prontos para você abrir e publicar. Carrosséis de 5, 6, 8 slides. Infográficos. Posts únicos. Thumbnails para vídeo.
                - paragraph [ref=e199]: Cada post sai com o design system da sua marca aplicado automaticamente. Suas cores. Suas fontes. Seu logo. Seu estilo. Ninguém olha e pensa "isso foi feito por robô".
                - list [ref=e200]:
                  - listitem [ref=e201]: Carrosséis em alta resolução (2160×2700px, retina @2x)
                  - listitem [ref=e202]: Infográficos com dados reais extraídos da análise competitiva
                  - listitem [ref=e203]: Templates reutilizáveis que mantêm a identidade visual consistente
                  - listitem [ref=e204]: Renderização automática em PNG pronto para publicação
                  - listitem [ref=e205]: Adaptação de dimensões por plataforma (feed, stories, reels, shorts)
                - heading "Gerar imagens fotorrealistas com IALink to section" [level=3] [ref=e206]:
                  - text: Gerar imagens fotorrealistas com IA
                  - link "Link to section" [ref=e207] [cursor=pointer]:
                    - /url: "#gerar-imagens-fotorrealistas-com-ia"
                    - img [ref=e208]
                - paragraph [ref=e211]: Chega de banco de imagens. O sistema gera fotos que parecem ter sido tiradas por um fotógrafo profissional. Capas para carrosséis. Hero shots para landing pages. Product shots para e-commerce.
                - paragraph [ref=e212]: Você descreve o que precisa. O sistema cria a imagem em resolução alta, pronta para usar em qualquer material.
                - list [ref=e213]:
                  - listitem [ref=e214]: Imagens em 1K, 2K ou 4K conforme a necessidade
                  - listitem [ref=e215]: Hero shots para capas de carrosséis e landing pages
                  - listitem [ref=e216]: Product shots com fundo e iluminação profissional
                  - listitem [ref=e217]: Lifestyle images com contexto e cenário realista
                  - listitem [ref=e218]: Geração em lote para projetos com múltiplos posts
                - heading "Escrever legendas que geram engajamentoLink to section" [level=3] [ref=e219]:
                  - text: Escrever legendas que geram engajamento
                  - link "Link to section" [ref=e220] [cursor=pointer]:
                    - /url: "#escrever-legendas-que-geram-engajamento"
                    - img [ref=e221]
                - paragraph [ref=e224]: Legenda não é afterthought. É o que transforma visualização em ação. O sistema escreve legendas com hook que prende nos primeiros 125 caracteres, corpo que entrega valor, CTA que direciona e hashtags pesquisadas para alcance orgânico.
                - paragraph [ref=e225]: "E mais: cada post recebe alt-text acessível para que seu conteúdo alcance todo mundo."
                - list [ref=e226]:
                  - listitem [ref=e227]: Hook otimizado com limite de 125 caracteres para não ser cortado no feed
                  - listitem [ref=e228]: Corpo da legenda com até 300 palavras, estruturado para leitura
                  - listitem [ref=e229]: 3 a 5 hashtags pesquisadas por relevância e volume de busca
                  - listitem [ref=e230]: SEO keywords integradas naturalmente no texto
                  - listitem [ref=e231]: Alt-text descritivo para acessibilidade e indexação por buscadores
                  - listitem [ref=e232]: "Geração em lote: 50 legendas de uma vez"
                - heading "Criar ofertas irresistíveis e funis de vendaLink to section" [level=3] [ref=e233]:
                  - text: Criar ofertas irresistíveis e funis de venda
                  - link "Link to section" [ref=e234] [cursor=pointer]:
                    - /url: "#criar-ofertas-irresistveis-e-funis-de-venda"
                    - img [ref=e235]
                - paragraph [ref=e238]: Vender não é empurrar produto. É construir uma escada de valor onde cada degrau faz sentido para o cliente.
                - paragraph [ref=e239]: "O sistema monta a oferta usando os frameworks de Alex Hormozi e Russell Brunson. Define o que entra no pacote, quais bônus fazem sentido, como apresentar o preço para que pareça ridiculamente barato pelo valor entregue. Depois projeta o funil completo: da primeira impressão até o carrinho fechado."
                - list [ref=e240]:
                  - listitem [ref=e241]: "Ofertas Grand Slam (Hormozi): core + bônus + garantia + escassez real"
                  - listitem [ref=e242]: "Value Ladder completa: isca digital, tripwire, core offer, high ticket"
                  - listitem [ref=e243]: "Funis de venda projetados fase a fase: awareness, consideração, conversão"
                  - listitem [ref=e244]: Tratamento de objeções mapeado para cada etapa do funil
                  - listitem [ref=e245]: Precificação baseada em valor, não em custo
                - heading "Escrever copy de alta conversãoLink to section" [level=3] [ref=e246]:
                  - text: Escrever copy de alta conversão
                  - link "Link to section" [ref=e247] [cursor=pointer]:
                    - /url: "#escrever-copy-de-alta-converso"
                    - img [ref=e248]
                - paragraph [ref=e251]: Sales letters que agarram pela gola e não soltam. Headlines magnéticas que param o scroll. Emails que abrem, leem e clicam. Landing pages que convertem visitante em cliente.
                - paragraph [ref=e252]: A copy sai adaptada para o mercado brasileiro. Não é tradução de fórmula americana. É texto que fala a língua do seu público, com as dores, aspirações e referências culturais certas.
                - list [ref=e253]:
                  - listitem [ref=e254]: "Sales letters completas: headline, lead, body, oferta, CTA, PS"
                  - listitem [ref=e255]: Packs de 25+ headlines categorizados por ângulo e fórmula comprovada
                  - listitem [ref=e256]: "Sequências de email: soap opera, nutrição, venda, carrinho abandonado, pós-compra"
                  - listitem [ref=e257]: Copy de landing page com estrutura de conversão testada
                  - listitem [ref=e258]: BrandScript SB7 para clareza de mensagem antes de qualquer peça de copy
                  - listitem [ref=e259]: "Tudo passa no Grunt Test: se não entende em 5 segundos, volta para reescrita"
                - heading "Planejar lançamentos digitais completosLink to section" [level=3] [ref=e260]:
                  - text: Planejar lançamentos digitais completos
                  - link "Link to section" [ref=e261] [cursor=pointer]:
                    - /url: "#planejar-lanamentos-digitais-completos"
                    - img [ref=e262]
                - paragraph [ref=e265]: Do seed launch ao JV launch. O sistema planeja cada fase do lançamento, define a sequência de CPLs (Conteúdos Pré-Lançamento), cria o calendário, monta a estratégia de tráfego e escreve os roteiros de cada etapa.
                - paragraph [ref=e266]: Você não precisa ser especialista em Product Launch Formula. O sistema já é.
                - list [ref=e267]:
                  - listitem [ref=e268]: Lançamento semente, interno, JV e perpétuo
                  - listitem [ref=e269]: Sequência de CPLs com roteiros completos
                  - listitem [ref=e270]: Calendário com timeline e marcos definidos
                  - listitem [ref=e271]: Estratégia de tráfego pago integrada ao lançamento
                  - listitem [ref=e272]: Checklist de execução fase a fase
                  - listitem [ref=e273]: Projeções de faturamento baseadas em benchmarks
                - heading "Definir precificação baseada em valorLink to section" [level=3] [ref=e274]:
                  - text: Definir precificação baseada em valor
                  - link "Link to section" [ref=e275] [cursor=pointer]:
                    - /url: "#definir-precificao-baseada-em-valor"
                    - img [ref=e276]
                - paragraph [ref=e279]: Preço não é conta de padaria. É percepção de valor. O sistema analisa seu mercado, pesquisa disposição a pagar, cria tiers de preço que maximizam receita e projeta a economia do negócio.
                - list [ref=e280]:
                  - listitem [ref=e281]: Pesquisa de willingness-to-pay do público
                  - listitem [ref=e282]: Benchmark de preços contra concorrentes
                  - listitem [ref=e283]: Tiers de preço otimizados (Starter, Pro, Enterprise)
                  - listitem [ref=e284]: Projeção financeira com cenários conservador, realista e otimista
                  - listitem [ref=e285]: Página de pricing com copy e framing otimizados
                  - listitem [ref=e286]: "Purple Cow: diferenciação que justifica preço premium"
                - heading "Criar design systems e materiais visuaisLink to section" [level=3] [ref=e287]:
                  - text: Criar design systems e materiais visuais
                  - link "Link to section" [ref=e288] [cursor=pointer]:
                    - /url: "#criar-design-systems-e-materiais-visuais"
                    - img [ref=e289]
                - paragraph [ref=e292]: O sistema extrai os tokens de design de qualquer referência. Cores, fontes, espaçamentos, cantos. Depois aplica tudo automaticamente em cada peça criada. Posts, apresentações, PDFs, tudo sai com a mesma identidade visual.
                - list [ref=e293]:
                  - listitem [ref=e294]: Extração automática de design tokens de qualquer URL ou referência
                  - listitem [ref=e295]: CSS custom properties geradas automaticamente
                  - listitem [ref=e296]: "Renderização em múltiplos formatos: PNG, PDF, PPTX (16:9)"
                  - listitem [ref=e297]: Apresentações profissionais com layout consistente
                  - listitem [ref=e298]: Re-aplicação de marca em materiais existentes
                - heading "Validar qualidade automaticamenteLink to section" [level=3] [ref=e299]:
                  - text: Validar qualidade automaticamente
                  - link "Link to section" [ref=e300] [cursor=pointer]:
                    - /url: "#validar-qualidade-automaticamente"
                    - img [ref=e301]
                - paragraph [ref=e304]: Antes de qualquer peça ser entregue, o sistema faz uma inspeção visual automatizada. Verifica consistência de marca, legibilidade, alinhamento, qualidade de imagem. Cada post recebe uma nota de 0 a 100. Se não passar no padrão, volta para ajuste.
                - list [ref=e305]:
                  - listitem [ref=e306]: Inspeção visual automatizada via visão computacional
                  - listitem [ref=e307]: Score de qualidade 0-100 por post
                  - listitem [ref=e308]: Verificação de consistência de marca (cores, fontes, logo)
                  - listitem [ref=e309]: "Validação cross-platform: dimensões corretas para cada rede"
                  - listitem [ref=e310]: Checagem de legibilidade e contraste de texto
                - separator [ref=e311]
                - heading "💡 Exemplos de UsoLink to section" [level=2] [ref=e312]:
                  - text: 💡 Exemplos de Uso
                  - link "Link to section" [ref=e313] [cursor=pointer]:
                    - /url: "#-exemplos-de-uso"
                    - img [ref=e314]
                - paragraph [ref=e317]: Esses não são cenários hipotéticos. Cada um abaixo é algo que o sistema faz hoje. Não é roadmap. Não é "em breve". Não é promessa futura.
                - paragraph [ref=e318]: São situações reais que pessoas reais enfrentam todo dia. E o sistema resolve cada uma delas.
                - heading "1. Agência gerenciando 10 clientesLink to section" [level=3] [ref=e319]:
                  - text: 1. Agência gerenciando 10 clientes
                  - link "Link to section" [ref=e320] [cursor=pointer]:
                    - /url: "#1-agncia-gerenciando-10-clientes"
                    - img [ref=e321]
                - paragraph [ref=e324]:
                  - strong [ref=e325]: "Situação:"
                  - text: Você é uma agência de marketing digital. Tem 10 clientes que precisam de conteúdo semanal para Instagram. Cada cliente tem sua marca, seu tom de voz, seu público. Sua equipe de 3 pessoas está sobrecarregada e a qualidade está caindo. O designer vive atrasado. A copywriter não dá conta de 50 legendas por semana. E contratar mais gente vai comer a margem inteira.
                - paragraph [ref=e326]:
                  - strong [ref=e327]: "O que o sistema faz:"
                  - text: "Você configura o design system de cada cliente uma vez: cores, fontes, estilo, tom de voz. Depois, toda semana, pede os posts. O sistema cria carrosséis com dados relevantes, gera imagens originais para as capas, escreve legendas com hooks testados, aplica a identidade visual de cada marca e entrega tudo renderizado em alta resolução. Ao mesmo tempo, monitora os concorrentes de cada cliente e entrega relatórios semanais com insights acionáveis."
                - paragraph [ref=e328]:
                  - strong [ref=e329]: "Resultado:"
                  - text: "50 posts por semana para 10 clientes, cada um com sua identidade visual intacta. Sua equipe para de criar conteúdo e começa a fazer o que realmente importa: estratégia, relacionamento com o cliente e prospecção de novos contratos. A margem da agência sobe porque o custo por post despenca."
                - heading "2. Médico que quer presença nas redesLink to section" [level=3] [ref=e330]:
                  - text: 2. Médico que quer presença nas redes
                  - link "Link to section" [ref=e331] [cursor=pointer]:
                    - /url: "#2-mdico-que-quer-presena-nas-redes"
                    - img [ref=e332]
                - paragraph [ref=e335]:
                  - strong [ref=e336]: "Situação:"
                  - text: Dr. Paulo é cardiologista. Sabe que precisa estar nas redes sociais, mas não tem tempo nem sabe por onde começar. Já tentou contratar um social media, mas o conteúdo ficava genérico e sem autoridade. Seus pacientes merecem informação de qualidade, não post de template.
                - paragraph [ref=e337]:
                  - strong [ref=e338]: "O que o sistema faz:"
                  - text: Analisa os 5 maiores perfis de cardiologistas do Instagram. Identifica quais assuntos geram mais engajamento, quais formatos funcionam melhor, qual tom de voz conecta. Depois cria 10 posts por semana com conteúdo educativo, carrosséis com dados relevantes, imagens fotorrealistas para as capas e legendas que posicionam o Dr. Paulo como autoridade na área.
                - paragraph [ref=e339]:
                  - strong [ref=e340]: "Resultado:"
                  - text: Em um mês, Dr. Paulo tem 40 posts profissionais publicados. Seus pacientes compartilham o conteúdo. Colegas médicos começam a seguir. A agenda presencial começa a encher com pacientes que dizem "te encontrei pelo Instagram".
                - heading "3. E-commerce lançando produto novoLink to section" [level=3] [ref=e341]:
                  - text: 3. E-commerce lançando produto novo
                  - link "Link to section" [ref=e342] [cursor=pointer]:
                    - /url: "#3-e-commerce-lanando-produto-novo"
                    - img [ref=e343]
                - paragraph [ref=e346]:
                  - strong [ref=e347]: "Situação:"
                  - text: Uma marca de cosméticos naturais vai lançar sua nova linha de skincare. São 5 produtos novos. A equipe de marketing tem uma designer e um estagiário. Precisa de funil de vendas, landing page, sequência de emails, anúncios, posts de lançamento e uma oferta que faça as pessoas comprarem no primeiro dia. O prazo? Duas semanas.
                - paragraph [ref=e348]:
                  - strong [ref=e349]: "O que o sistema faz:"
                  - text: "Começa montando a oferta Grand Slam: produto core + bônus complementares (guia de rotina skincare + acesso a grupo VIP) + garantia de 30 dias + escassez real (primeiras 200 unidades com desconto). Projeta o funil completo de 4 fases: awareness com posts educativos, consideração com depoimentos e antes/depois, decisão com oferta + urgência, pós-compra com onboarding. Escreve a sales letter da landing page. Cria a sequência de 7 emails soap opera para gerar conexão, seguida de 5 emails de venda com urgência progressiva. Gera product shots fotorrealistas dos 5 produtos e posts de aquecimento para as redes."
                - paragraph [ref=e350]:
                  - strong [ref=e351]: "Resultado:"
                  - text: Um lançamento completo pronto para executar em uma semana de produção. Landing page com copy de conversão, 12 emails, 15 posts de aquecimento, 5 product shots profissionais. Tudo com visual consistente com a marca. O time só precisa agendar e apertar o botão de "publicar".
                - heading "4. Criador de conteúdo escalando produçãoLink to section" [level=3] [ref=e352]:
                  - text: 4. Criador de conteúdo escalando produção
                  - link "Link to section" [ref=e353] [cursor=pointer]:
                    - /url: "#4-criador-de-contedo-escalando-produo"
                    - img [ref=e354]
                - paragraph [ref=e357]:
                  - strong [ref=e358]: "Situação:"
                  - text: Marina é influenciadora de produtividade com 80k seguidores. Posta 5 vezes por semana, mas cada post leva 3 horas entre pesquisa, criação, texto e publicação. São 15 horas por semana só para manter a frequência. Ela quer dobrar a produção sem dobrar o tempo.
                - paragraph [ref=e359]:
                  - strong [ref=e360]: "O que o sistema faz:"
                  - text: "Analisa os 50 posts mais recentes de Marina e dos top 10 perfis do nicho de produtividade. Identifica os temas que mais engajam, os formatos que geram mais saves e shares, os hooks que prendem nos primeiros 3 segundos. Depois cria 10 posts por semana: carrosséis com o estilo visual de Marina, legendas no tom de voz dela, imagens originais e hashtags pesquisadas."
                - paragraph [ref=e361]:
                  - strong [ref=e362]: "Resultado:"
                  - text: Marina dobrou a frequência de posts sem adicionar uma hora sequer na agenda. O engajamento subiu porque o conteúdo agora é baseado em dados, não em intuição. Ela usa o tempo livre para gravar vídeos e criar produtos digitais.
                - heading "5. SaaS planejando lançamento com PLFLink to section" [level=3] [ref=e363]:
                  - text: 5. SaaS planejando lançamento com PLF
                  - link "Link to section" [ref=e364] [cursor=pointer]:
                    - /url: "#5-saas-planejando-lanamento-com-plf"
                    - img [ref=e365]
                - paragraph [ref=e368]:
                  - strong [ref=e369]: "Situação:"
                  - text: Uma startup de software de gestão financeira está pronta para lançar. O produto é bom, a equipe de dev é forte, mas ninguém ali sabe montar um lançamento digital. Já tentaram "só colocar no ar" duas vezes e o resultado foi um punhado de signups e muito silêncio. O investidor quer ver tração real.
                - paragraph [ref=e370]:
                  - strong [ref=e371]: "O que o sistema faz:"
                  - text: "Planeja um lançamento completo usando Product Launch Formula. Define os 4 CPLs (Conteúdos Pré-Lançamento) com roteiros detalhados: CPL1 mostra a oportunidade, CPL2 apresenta a transformação, CPL3 dá um gostinho da experiência, CPL4 abre o carrinho. Cria a value ladder: trial gratuito de 14 dias, plano mensal a R$97, plano anual a R$897 (2 meses grátis), plano enterprise sob consulta. Monta a oferta de lançamento com bônus exclusivos para os primeiros 100 assinantes anuais: onboarding personalizado + template de fluxo de caixa + 30 minutos de consultoria. Escreve a sequência completa de emails de aquecimento (7 emails), a sales letter da página de vendas e os anúncios para tráfego pago com 3 variações de copy por público."
                - paragraph [ref=e372]:
                  - strong [ref=e373]: "Resultado:"
                  - text: Um lançamento estruturado com timeline de 45 dias, 4 roteiros de CPL, 12 emails, landing page com sales letter, 6 variações de anúncio e projeção financeira com 3 cenários. A equipe técnica executa o plano passo a passo sem precisar virar especialista em marketing digital.
                - heading "6. Social media monitorando concorrentes semanalmenteLink to section" [level=3] [ref=e374]:
                  - text: 6. Social media monitorando concorrentes semanalmente
                  - link "Link to section" [ref=e375] [cursor=pointer]:
                    - /url: "#6-social-media-monitorando-concorrentes-semanalmente"
                    - img [ref=e376]
                - paragraph [ref=e379]:
                  - strong [ref=e380]: "Situação:"
                  - text: Gabriela gerencia as redes sociais de uma rede de academias. O dono cobra relatórios semanais de concorrência, mas ela gasta um dia inteiro toda semana abrindo perfil por perfil, anotando números, tentando identificar o que os concorrentes estão fazendo de diferente.
                - paragraph [ref=e381]:
                  - strong [ref=e382]: "O que o sistema faz:"
                  - text: Todo domingo à noite, Gabriela roda o monitoramento semanal. O sistema analisa os 8 concorrentes cadastrados, coleta todos os posts da semana, calcula métricas de engajamento, detecta posts virais, identifica tendências e gera um relatório executivo com os insights mais importantes.
                - paragraph [ref=e383]:
                  - strong [ref=e384]: "Resultado:"
                  - text: Na segunda de manhã, Gabriela chega com o relatório pronto. Apresenta para o dono em 10 minutos. Usa os insights para planejar o conteúdo da semana. O que levava um dia inteiro agora leva 15 minutos.
                - heading "7. Consultor criando material de vendaLink to section" [level=3] [ref=e385]:
                  - text: 7. Consultor criando material de venda
                  - link "Link to section" [ref=e386] [cursor=pointer]:
                    - /url: "#7-consultor-criando-material-de-venda"
                    - img [ref=e387]
                - paragraph [ref=e390]:
                  - strong [ref=e391]: "Situação:"
                  - text: Ricardo é consultor de vendas B2B. Vai fazer um pitch para uma rede de franquias. Precisa de uma apresentação profissional, uma proposta comercial em PDF e posts para LinkedIn que posicionem sua autoridade antes da reunião. Ele não tem designer. A última proposta que mandou foi em Word com formatação quebrada e o prospect nem respondeu.
                - paragraph [ref=e392]:
                  - strong [ref=e393]: "O que o sistema faz:"
                  - text: "Extrai o design system da marca de Ricardo a partir do site dele (cores, fontes, estilo). Cria uma apresentação PPTX de 15 slides com a estrutura completa de pitch: problema do mercado, solução, diferenciais, cases, plano de ação, investimento. Renderiza uma proposta comercial em PDF de 8 páginas com layout profissional e dados personalizados. Gera 8 posts para LinkedIn com conteúdo que demonstra expertise em vendas B2B. Escreve a copy de uma one-page sales letter para enviar por email 3 dias antes da reunião, aquecendo o prospect."
                - paragraph [ref=e394]:
                  - strong [ref=e395]: "Resultado:"
                  - text: Ricardo chega na reunião com material que parece ter sido feito por uma agência que cobra R$15 mil por mês. O prospect folheia a proposta e diz "vocês são profissionais". Os posts no LinkedIn, publicados na semana anterior, já tinham gerado 3 conexões no setor de franquias. O contrato de R$120 mil sai assinado na segunda reunião.
                - heading "8. Nutricionista querendo 50 posts prontosLink to section" [level=3] [ref=e396]:
                  - text: 8. Nutricionista querendo 50 posts prontos
                  - link "Link to section" [ref=e397] [cursor=pointer]:
                    - /url: "#8-nutricionista-querendo-50-posts-prontos"
                    - img [ref=e398]
                - paragraph [ref=e401]:
                  - strong [ref=e402]: "Situação:"
                  - text: "Dra. Camila é nutricionista funcional. Quer 50 posts educativos para 2 meses de conteúdo: carrosséis sobre alimentos, infográficos com dados nutricionais, dicas práticas. Mas não quer conteúdo genérico. Quer posts que reflitam seu posicionamento e se diferenciem dos milhares de nutricionistas no Instagram."
                - paragraph [ref=e403]:
                  - strong [ref=e404]: "O que o sistema faz:"
                  - text: "Analisa os perfis dos maiores nutricionistas do Instagram. Identifica gaps de conteúdo (o que ninguém está falando). Cria 50 posts completos: 30 carrosséis de 6 slides + 20 infográficos. Gera 48 imagens fotorrealistas de alimentos e preparações para as capas. Escreve 50 legendas com linguagem acessível, hooks que prendem e CTAs que direcionam para o consultório. Aplica o design system da Dra. Camila em cada peça. Valida qualidade visual de cada post."
                - paragraph [ref=e405]:
                  - strong [ref=e406]: "Resultado:"
                  - text: 50 posts profissionais, 250 PNGs em alta resolução, 48 imagens originais, 50 legendas otimizadas. Dois meses de conteúdo prontos para agendar. A Dra. Camila só precisa revisar e publicar. Esse cenário não é hipotético. É exatamente o que o Projeto NutroPosts entregou.
