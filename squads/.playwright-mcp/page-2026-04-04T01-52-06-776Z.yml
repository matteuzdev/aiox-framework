                    - img [ref=e521]
                - paragraph [ref=e524]: Além de pedidos avulsos, o sistema tem 13 fluxos completos que executam processos inteiros do começo ao fim. Você ativa, configura os parâmetros e recebe o resultado completo.
                - heading "Produção e conteúdoLink to section" [level=3] [ref=e525]:
                  - text: Produção e conteúdo
                  - link "Link to section" [ref=e526] [cursor=pointer]:
                    - /url: "#produo-e-contedo"
                    - img [ref=e527]
                - paragraph [ref=e530]:
                  - strong [ref=e531]: Produção completa de conteúdo.
                  - text: O fluxo mais poderoso. Você informa os perfis de referência, o tema e a quantidade. O sistema analisa os concorrentes, extrai insights, cria os posts, gera imagens, escreve legendas, aplica o design system e valida qualidade. É o fluxo que produziu os 50 posts do Projeto NutroPosts.
                - paragraph [ref=e532]:
                  - strong [ref=e533]: Conteúdo multi-plataforma.
                  - text: Um conteúdo, múltiplas plataformas. Cria posts para Instagram, adapta para TikTok, gera versão para YouTube Shorts e formata para Facebook. Cada versão respeita as dimensões e boas práticas da plataforma.
                - paragraph [ref=e534]:
                  - strong [ref=e535]: Refresh de marca.
                  - text: Mudou a identidade visual? Esse fluxo re-aplica os novos tokens de design em todos os materiais existentes. Cores, fontes, espaçamentos. Tudo atualizado de uma vez.
                - heading "Inteligência competitivaLink to section" [level=3] [ref=e536]:
                  - text: Inteligência competitiva
                  - link "Link to section" [ref=e537] [cursor=pointer]:
                    - /url: "#inteligncia-competitiva"
                    - img [ref=e538]
                - paragraph [ref=e541]:
                  - strong [ref=e542]: Análise semanal profunda.
                  - text: O fluxo mais completo de inteligência. Analisa múltiplos perfis, calcula métricas, detecta posts virais, identifica tendências e gera relatório executivo. Rode toda segunda-feira e comece a semana sabendo exatamente o que seus concorrentes fizeram.
                - paragraph [ref=e543]:
                  - strong [ref=e544]: Scan rápido de concorrentes.
                  - text: Precisa de um panorama rápido? Esse fluxo faz uma varredura express e entrega os destaques em minutos.
                - paragraph [ref=e545]:
                  - strong [ref=e546]: Monitoramento semanal.
                  - text: Versão enxuta da análise profunda. Acompanha métricas-chave e alerta sobre mudanças relevantes. Ideal para manutenção contínua.
                - paragraph [ref=e547]:
                  - strong [ref=e548]: Ciclo mensal de inteligência.
                  - text: Análise aprofundada com visão de longo prazo. Tendências de crescimento, evolução de engajamento, mudanças de estratégia dos concorrentes.
                - paragraph [ref=e549]:
                  - strong [ref=e550]: Deep dive orgânico.
                  - text: Mergulho profundo no conteúdo orgânico. Analisa cada post, cada comentário, cada interação para encontrar padrões que não aparecem na superfície. Ideal para entender de verdade o que faz um perfil crescer.
                - paragraph [ref=e551]:
                  - strong [ref=e552]: Análise de anúncios pagos.
                  - text: Vasculha a Meta Ads Library e analisa os anúncios ativos dos concorrentes. Identifica formatos vencedores, estimativas de investimento e testes A/B em andamento.
                - paragraph [ref=e553]:
                  - strong [ref=e554]: Construtor de swipe file.
                  - text: Coleta os melhores anúncios do seu nicho e organiza em um arquivo de referência. Cada anúncio com análise de hook, copy, CTA e estimativa de performance.
                - heading "Estratégia e vendasLink to section" [level=3] [ref=e555]:
                  - text: Estratégia e vendas
                  - link "Link to section" [ref=e556] [cursor=pointer]:
                    - /url: "#estratgia-e-vendas"
                    - img [ref=e557]
                - paragraph [ref=e560]:
                  - strong [ref=e561]: Sala de guerra estratégica.
                  - text: Reúne todos os especialistas em estratégia para uma sessão intensiva. Análise de mercado, posicionamento, mensagem, oferta, canais. Sai com um plano de ação completo e priorizado. É como ter uma reunião de diretoria do seu marketing, mas sem precisar contratar os diretores.
                - paragraph [ref=e562]:
                  - strong [ref=e563]: Criação completa de funil.
                  - text: "Monta o funil inteiro: pesquisa de mercado, criação da oferta, copy da landing page, sequência de emails, anúncios. Do topo ao fundo do funil, tudo conectado e coerente. Cada etapa alimenta a próxima."
                - paragraph [ref=e564]:
                  - strong [ref=e565]: Lançamento digital.
                  - text: Planejamento e produção completos de um lançamento usando Product Launch Formula. Timeline, CPLs com roteiros detalhados, emails de aquecimento e venda, posts para redes sociais, estratégia de tráfego pago, projeção financeira com cenários. Tudo pronto para executar fase a fase.
