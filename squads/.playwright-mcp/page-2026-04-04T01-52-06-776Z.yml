                - blockquote [ref=e512]:
                  - paragraph [ref=e513]:
                    - strong [ref=e514]: 50 posts. 250 PNGs. 48 imagens originais. 50 legendas. 6 relatórios. Menos de 2 horas.
                - paragraph [ref=e515]: Dois meses de conteúdo profissional, pronto para agendar e publicar. Conteúdo que levaria uma equipe de 4 pessoas (estrategista, designer, copywriter, social media) pelo menos 2 semanas para produzir.
                - paragraph [ref=e516]: "Para colocar em perspectiva: uma agência cobraria entre R$8.000 e R$15.000 para produzir esse volume com essa qualidade. Um freelancer levaria de 3 a 4 semanas. Uma equipe interna gastaria pelo menos 80 horas de trabalho combinadas."
                - paragraph [ref=e517]: O Nirvana fez em menos de 2 horas.
                - separator [ref=e518]
                - heading "⚡ 13 fluxos automatizados prontos para usarLink to section" [level=2] [ref=e519]:
